<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi tienda de ropa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <a href="#" class="logo">URBAN<span>.</span>STYLE</a>
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Hombre</a>
            <a href="#">Mujer</a>
        </nav>
    </header>
        <section class="portada">
        <h2>Nueva colección</h2>
        <p>Estilo sin esfuerzo para cada día</p>
        <a href="#" class="boton">Ver productos</a>
    </section> 

        <main>
        <h1>Nuestros productos</h1>

        <div class="productos">
            
            <article class="producto">
                <span class ="etiqueta">Novedad</span>
                <img src="img/camiseta.webp" alt="Camiseta básica">
                <h2>Camiseta básica</h2>
                <p class="precio">15 €</p>
                <button class="boton boton-producto">Añadir al carrito</button>
            </article>

            <article class="producto">
                <img src="img/vaqueros.webp" alt="Vaqueros"alt="Vaqueros">
                <h2>Vaqueros</h2>
                <p class="precio">39 €</p>
                <button class="boton boton-producto">Añadir al carrito</button>
            </article>

            <article class="producto">
                <img src="img/sudaderas img.jpg" alt="Sudadera"  alt="Sudadera">
                <h2>Sudadera</h2>
                <p class="precio">29 €</p>
                <button class="boton boton-producto">Añadir al carrito</button>
            </article>

            <article class="producto">
                <img src="img/chaquetas img.jpg" alt="Chaqueta" alt="Chaqueta">
                <h2>Chaqueta</h2>
                <p class="precio ><span class="precio-antiguo">60 €</span> 45 €</p>
                <button class="boton boton-producto">Añadir al carrito</button>
            </article>

            <article class="producto">
                <span class="etiqueta etiqueta-oferta">Oferta</span>
                <img src="img/zapartillas.jpg" alt="Zapatillas">
                <h2>Zapatillas</h2>
                <p class="precio precio-oferta"><span class="precio-antiguo">18 €</span> 12 €</p>
                <button class="boton boton-producto">Añadir al carrito</button>
            </article>

            <article class="producto">
                <span class="etiqueta etiqueta-oferta">Oferta</span>
                <img src="img/gorra img.jpg" alt="Gorra">
                <h2>Gorra</h2>
                <p class="precio precio-oferta"><span class="precio-antiguo">15 €</span> 12 €</p>
                <button class="boton boton-producto">Añadir al carrito</button>
            </article>
        </div>
    
    </main>
        <footer>
        <p>© 2026 Mi tienda de ropa</p>
    </footer>
</body>

</html>
